<!DOCTYPE html>

<html lang="es">

<head>

    <!-- Permite utilizar tildes, ñ y otros caracteres -->
    <meta charset="UTF-8">

    <!-- Nombre que aparecerá en la pestaña del navegador -->
    <title>TakeOff UP</title>

    <!-- Conectamos nuestro HTML con el archivo CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- ========================================
         PANTALLA DE ACCESO
         Esta sección representa la página 1
         de nuestro diseño.
         ======================================== -->

    <main class="acceso">


        <!-- Tarjeta blanca que aparece
             en el centro de la pantalla -->

        <section class="tarjeta-acceso">


            <!-- LOGO -->

            <!-- Cuando tengamos el archivo del logo,
                 lo guardaremos dentro de Imagen -->

            <img
                class="logo"
                src="Imagen/logo-takeoff.png"
                alt="Logo TakeOff UP"
            >


            <!-- TEXTO PEQUEÑO -->

            <p class="mision">
                TU MISIÓN COMIENZA AQUÍ
            </p>


            <!-- TÍTULO PRINCIPAL -->

            <h1>
                Tu siguiente nivel
                <br>
                está por despegar.
            </h1>


            <!-- DESCRIPCIÓN -->

            <p class="descripcion">
                Descubre tus fortalezas y construye
                <br>
                tu propia ruta de desarrollo.
            </p>


            <!-- BOTÓN -->

            <!-- Por ahora será únicamente visual.
                 Más adelante aprenderemos a darle
                 funcionalidad. -->

            <button>
                ✉ Ingresar con correo UP →
            </button>


            <!-- TEXTO INFERIOR -->

            <p class="institucional">
                ♢ &nbsp; Acceso con tu cuenta
                <br>
                institucional
            </p>


        </section>

    </main>

</body>

</html>
